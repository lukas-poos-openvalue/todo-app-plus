version: '3.8'
services:
  database:
    image: docker.io/postgres:18.6-alpine
    restart: never
    environment:
      POSTGRES_DB: todo-app-plus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres" ]
      interval: 10s
      timeout: 10s
      retries: 5

  keycloak:
    depends_on:
      database:
        condition: service_healthy
    image: docker.io/keycloak/keycloak:26.7
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    volumes:
      - ./src/test/resources/realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


volumes:
  database-data: